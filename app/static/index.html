<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>URL Shortener</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #6c63ff, #48cfad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      text-align: center;
      color: #888;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    /* Auth tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      background: #2a2a4a;
      color: #aaa;
      transition: all 0.2s;
    }
    .tab.active {
      background: #6c63ff;
      color: white;
    }

    .section { display: none; }
    .section.active { display: block; }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="url"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      background: #0f0f1a;
      color: #e0e0e0;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #6c63ff; }

    button.btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #6c63ff, #48cfad);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button.btn:hover { opacity: 0.85; }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      background: #0f0f1a;
      border-radius: 8px;
      border: 1px solid #2a2a4a;
      display: none;
    }
    .result-box.show { display: block; }
    .result-box label { font-size: 0.8rem; color: #888; }
    .short-url-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
    }
    .short-url-row a {
      color: #6c63ff;
      font-size: 1.1rem;
      word-break: break-all;
      flex: 1;
    }
    .copy-btn {
      padding: 6px 14px;
      border: 1px solid #6c63ff;
      border-radius: 6px;
      background: transparent;
      color: #6c63ff;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #6c63ff; color: white; }

    .msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      display: none;
    }
    .msg.error { background: #3a1a1a; color: #ff6b6b; border: 1px solid #ff4444; display: block; }
    .msg.success { background: #1a3a2a; color: #48cfad; border: 1px solid #48cfad; display: block; }

    .auth-status {
      text-align: center;
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 20px;
    }
    .auth-status span { color: #48cfad; }

    .logout-btn {
      background: none;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      font-size: 0.85rem;
      margin-left: 8px;
      text-decoration: underline;
    }

    .history { margin-top: 24px; }
    .history h3 { font-size: 0.9rem; color: #888; margin-bottom: 10px; }
    .history-item {
      background: #0f0f1a;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }
    .history-item a { color: #6c63ff; }
    .history-item .original { color: #666; font-size: 0.78rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .history-item .clicks { color: #48cfad; font-size: 0.78rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ URL Shortener</h1>
    <p class="subtitle">Shorten any link in seconds</p>

    <div class="auth-status" id="authStatus">
      Not logged in — links won't be saved to your account.
    </div>

    <!-- TABS -->
    <div class="tabs" id="authTabs">
      <button class="tab active" onclick="showTab('shorten')">Shorten</button>
      <button class="tab" onclick="showTab('register')">Register</button>
      <button class="tab" onclick="showTab('login')">Login</button>
    </div>

    <!-- SHORTEN SECTION -->
    <div class="section active" id="section-shorten">
      <input type="url" id="longUrl" placeholder="Paste your long URL here..." />
      <input type="text" id="customCode" placeholder="Custom short code (optional)" />
      <button class="btn" onclick="shortenUrl()">Shorten URL</button>

      <div class="msg" id="shortenMsg"></div>

      <div class="result-box" id="resultBox">
        <label>Your short URL:</label>
        <div class="short-url-row">
          <a id="shortUrlLink" href="#" target="_blank"></a>
          <button class="copy-btn" onclick="copyUrl()">Copy</button>
        </div>
      </div>

      <div class="history" id="historySection" style="display:none">
        <h3>Your recent links</h3>
        <div id="historyList"></div>
      </div>
    </div>

    <!-- REGISTER SECTION -->
    <div class="section" id="section-register">
      <input type="email" id="regEmail" placeholder="Email" />
      <input type="password" id="regPassword" placeholder="Password" />
      <button class="btn" onclick="register()">Create Account</button>
      <div class="msg" id="registerMsg"></div>
    </div>

    <!-- LOGIN SECTION -->
    <div class="section" id="section-login">
      <input type="email" id="loginEmail" placeholder="Email" />
      <input type="password" id="loginPassword" placeholder="Password" />
      <button class="btn" onclick="login()">Login</button>
      <div class="msg" id="loginMsg"></div>
    </div>

  </div>

  <script>
    const API = '';  // same origin

    let token = localStorage.getItem('token');
    let userEmail = localStorage.getItem('email');

    function updateAuthStatus() {
      const el = document.getElementById('authStatus');
      if (token) {
        el.innerHTML = `Logged in as <span>${userEmail}</span> <button class="logout-btn" onclick="logout()">Logout</button>`;
        loadHistory();
      } else {
        el.textContent = 'Not logged in — links won\'t be saved to your account.';
        document.getElementById('historySection').style.display = 'none';
      }
    }

    function showTab(name) {
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('section-' + name).classList.add('active');
      event.target.classList.add('active');
    }

    function showMsg(id, text, type) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.className = 'msg ' + type;
    }

    async function register() {
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      if (!email || !password) return showMsg('registerMsg', 'Fill in all fields', 'error');

      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (res.ok) {
        showMsg('registerMsg', 'Account created! Please login.', 'success');
      } else {
        showMsg('registerMsg', data.detail || 'Error', 'error');
      }
    }

    async function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      if (!email || !password) return showMsg('loginMsg', 'Fill in all fields', 'error');

      const form = new FormData();
      form.append('username', email);
      form.append('password', password);

      const res = await fetch('/auth/login', { method: 'POST', body: form });
      const data = await res.json();
      if (res.ok) {
        token = data.access_token;
        localStorage.setItem('token', token);
        localStorage.setItem('email', email);
        userEmail = email;
        updateAuthStatus();
        showMsg('loginMsg', 'Logged in successfully!', 'success');
        setTimeout(() => showTab('shorten'), 1000);
      } else {
        showMsg('loginMsg', data.detail || 'Invalid credentials', 'error');
      }
    }

    function logout() {
      token = null;
      localStorage.removeItem('token');
      localStorage.removeItem('email');
      updateAuthStatus();
    }

    async function shortenUrl() {
      let url = document.getElementById('longUrl').value.trim();
      const customCode = document.getElementById('customCode').value.trim();
      if (!url) return showMsg('shortenMsg', 'Please enter a URL', 'error');

      // Auto-prepend https:// if missing
      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      const body = { original_url: url };
      if (customCode) body.custom_code = customCode;

      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['Authorization'] = 'Bearer ' + token;

      const res = await fetch('/shorten', {
        method: 'POST',
        headers,
        body: JSON.stringify(body)
      });
      const data = await res.json();

      if (res.ok) {
        document.getElementById('shortUrlLink').textContent = data.short_url;
        document.getElementById('shortUrlLink').href = data.short_url;
        document.getElementById('resultBox').classList.add('show');
        document.getElementById('shortenMsg').className = 'msg';
        document.getElementById('longUrl').value = '';
        document.getElementById('customCode').value = '';
        if (token) loadHistory();
      } else {
        // detail can be a string or an array (FastAPI validation errors)
        let errMsg = 'Error shortening URL';
        if (data.detail) {
          if (typeof data.detail === 'string') errMsg = data.detail;
          else if (Array.isArray(data.detail)) errMsg = data.detail.map(e => e.msg).join(', ');
        }
        showMsg('shortenMsg', errMsg, 'error');
      }
    }

    function copyUrl() {
      const url = document.getElementById('shortUrlLink').textContent;
      navigator.clipboard.writeText(url);
      const btn = document.querySelector('.copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    }

    async function loadHistory() {
      if (!token) return;
      const res = await fetch('/my-urls', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!res.ok) return;
      const urls = await res.json();
      const list = document.getElementById('historyList');
      const section = document.getElementById('historySection');
      if (urls.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      list.innerHTML = urls.slice(0, 5).map(u => `
        <div class="history-item">
          <a href="${u.short_url}" target="_blank">${u.short_url}</a>
          <span class="clicks"> · ${u.click_count} clicks</span>
          <div class="original">${u.original_url}</div>
        </div>
      `).join('');
    }

    updateAuthStatus();
  </script>
</body>
</html>
